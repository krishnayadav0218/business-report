name: Weekly Business Report

on:
  schedule:
    # Every Monday at 9:00 AM IST (03:30 UTC)
    - cron: "30 3 * * 1"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reporting pipeline
        env:
          DATA_SOURCE: ${{ secrets.DATA_SOURCE }}
          CSV_PATH: ${{ secrets.CSV_PATH }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          DB_ENGINE: ${{ secrets.DB_ENGINE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SQL_QUERY: ${{ secrets.SQL_QUERY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
        run: python src/main.py

      - name: Upload report as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-business-report
          path: output/*.pptx
