name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest

      # This job is the safety net that would have caught the exact bugs seen
      # in production (e.g. build_report() missing a kwarg app.py relies on).
      # If this fails, DO NOT deploy the code that failed it.
