<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Report Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --bg2: #0b1120;
    --teal: #34d3c0;
    --teal-dim: #2e9e8f;
    --coral: #ff7a4d;
    --grey: #8b93a7;
    --line: rgba(255,255,255,0.09);
    --glass: rgba(255,255,255,0.045);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: #EAEDF4;
    overflow: hidden;
  }

  /* ---- Layered background: gradient wash + animated dot grid + cursor spotlight ---- */
  .bg-wash {
    position: fixed; inset: 0;
    background:
      radial-gradient(1100px 600px at 18% 8%, rgba(46,158,143,0.16), transparent 60%),
      radial-gradient(900px 500px at 85% 88%, rgba(228,98,44,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg2) 55%, #0e1830 100%);
    z-index: 0;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 40%, transparent 90%);
    z-index: 1;
    animation: gridDrift 30s linear infinite;
  }
  @keyframes gridDrift {
    0% { background-position: 0 0, 0 0; }
    100% { background-position: 84px 42px, 84px 42px; }
  }
  .bg-spotlight {
    position: fixed; inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(420px circle at var(--sx, 50%) var(--sy, 40%), rgba(52,211,192,0.10), transparent 70%);
    transition: background 0.05s linear;
  }
  #scene-container {
    position: fixed; inset: 0;
    z-index: 1;
    opacity: 0.55;
  }
  #scene-container canvas { display: block; width: 100%; height: 100%; }

  /* ---- Layout ---- */
  .layout {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--teal);
    background: rgba(52,211,192,0.08);
    border: 1px solid rgba(52,211,192,0.25);
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  .kicker::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
  }

  /* ---- Glass card with animated gradient border ---- */
  .card-shell {
    position: relative;
    width: 100%;
    max-width: 400px;
    border-radius: 22px;
    padding: 1.5px;
    background: conic-gradient(from var(--angle, 0deg), rgba(52,211,192,0.6), rgba(255,255,255,0.06) 30%, rgba(228,98,44,0.5) 55%, rgba(255,255,255,0.06) 80%, rgba(52,211,192,0.6));
    animation: rotateBorder 6s linear infinite;
  }
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes rotateBorder {
    to { --angle: 360deg; }
  }

  .card {
    position: relative;
    background: rgba(10, 14, 26, 0.82);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-radius: 21px;
    padding: 40px 36px 36px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #ffffff 30%, #b9c3d6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.sub { color: var(--grey); font-size: 13.5px; margin: 0 0 26px; line-height: 1.55; }

  .field { position: relative; margin-bottom: 18px; }
  .field svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; opacity: 0.45; pointer-events: none;
  }
  input[type="password"] {
    width: 100%;
    padding: 13px 15px 13px 40px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    color: #EAEDF4;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  input[type="password"]::placeholder { color: #626d84; }
  input[type="password"]:focus {
    outline: none;
    border-color: rgba(52,211,192,0.55);
    box-shadow: 0 0 0 4px rgba(52,211,192,0.12);
    background: rgba(255,255,255,0.05);
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--teal-dim), var(--teal));
    color: #06110f;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.15s ease, filter 0.15s ease;
    box-shadow: 0 8px 24px -8px rgba(52,211,192,0.5);
  }
  button:hover { filter: brightness(1.08); box-shadow: 0 10px 28px -6px rgba(52,211,192,0.6); }
  button:active { transform: scale(0.98); }

  .error {
    display: flex; align-items: center; gap: 8px;
    color: #ffb199;
    background: rgba(228,98,44,0.1);
    border: 1px solid rgba(228,98,44,0.3);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    margin: -4px 0 16px;
  }

  .foot-note {
    margin-top: 22px;
    text-align: center;
    color: #566079;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .card { padding: 32px 24px 28px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>

<div class="bg-wash"></div>
<div class="bg-grid"></div>
<div id="scene-container"></div>
<div class="bg-spotlight" id="spotlight"></div>

<div class="layout">
  <div class="kicker">SECURE ACCESS</div>

  <div class="card-shell" id="card-shell">
    <div class="card" id="login-card">
      <h1>Business Report Generator</h1>
      <p class="sub">Enter the access password to continue to your dashboard.</p>
      <form method="POST">
        {% if error %}
        <div class="error">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          {{ error }}
        </div>
        {% endif %}
        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password" placeholder="Password" autofocus>
        </div>
        <button type="submit">Continue &rarr;</button>
      </form>
    </div>
  </div>

  <p class="foot-note">Encrypted session &middot; No data leaves this device unattended</p>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ---------------------------------------------------------------------
// Entrance motion
// ---------------------------------------------------------------------
if (window.gsap) {
  gsap.fromTo('.kicker', { y: -10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' });
  gsap.fromTo('#card-shell', { y: 22, opacity: 0, scale: 0.98 }, { y: 0, opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out', delay: 0.12 });
  gsap.fromTo('.foot-note', { opacity: 0 }, { opacity: 1, duration: 0.8, delay: 0.6 });
}

// ---------------------------------------------------------------------
// Cursor spotlight (21st.dev-style ambient highlight following the pointer)
// ---------------------------------------------------------------------
const spotlight = document.getElementById('spotlight');
window.addEventListener('pointermove', (e) => {
  spotlight.style.setProperty('--sx', e.clientX + 'px');
  spotlight.style.setProperty('--sy', e.clientY + 'px');
});

// ---------------------------------------------------------------------
// Ambient 3D mascot -- ["report bot"] rendered large and soft behind the
// glass card, so it reads as atmosphere rather than competing with the form.
// ---------------------------------------------------------------------
(function() {
  const container = document.getElementById('scene-container');
  if (!window.THREE) return;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.3, 8.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(3, 4, 5);
  scene.add(key);
  const fill = new THREE.PointLight(0x34d3c0, 0.7, 20);
  fill.position.set(-4, -2, 3);
  scene.add(fill);

  const COLORS = { navy: 0x24365c, teal: 0x2e9e8f, tealLight: 0x7fe0d1, coral: 0xff7a4d, white: 0xf4f5f7, grey: 0x8a94a6 };

  const mascot = new THREE.Group();
  scene.add(mascot);

  const bodyMat = new THREE.MeshStandardMaterial({ color: COLORS.teal, roughness: 0.55, metalness: 0.05, flatShading: true });
  mascot.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 0.7, 6, 16), bodyMat));

  const screenMat = new THREE.MeshStandardMaterial({ color: COLORS.navy, roughness: 0.5, flatShading: true });
  const screen = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.75, 0.06), screenMat);
  screen.position.set(0, 0.05, 0.82);
  mascot.add(screen);

  const barColors = [COLORS.tealLight, COLORS.coral, COLORS.tealLight];
  [0.28, 0.5, 0.38].forEach((h, i) => {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(0.16, h, 0.05), new THREE.MeshStandardMaterial({ color: barColors[i], flatShading: true }));
    bar.position.set(-0.25 + i * 0.25, -0.18 + h / 2, 0.87);
    mascot.add(bar);
  });

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 20, 20), new THREE.MeshStandardMaterial({ color: COLORS.navy, roughness: 0.5, flatShading: true }));
  head.position.set(0, 1.15, 0);
  head.scale.set(1, 0.92, 0.95);
  mascot.add(head);

  const eyeGroup = new THREE.Group();
  [-0.24, 0.24].forEach((x) => {
    const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), new THREE.MeshStandardMaterial({ color: COLORS.white, roughness: 0.3 }));
    eyeWhite.position.set(x, 1.2, 0.52);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 12), new THREE.MeshStandardMaterial({ color: 0x14202e, roughness: 0.2 }));
    pupil.position.set(x, 1.2, 0.63);
    eyeGroup.add(eyeWhite, pupil);
  });
  mascot.add(eyeGroup);

  const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), new THREE.MeshStandardMaterial({ color: COLORS.grey }));
  antenna.position.set(0, 1.75, 0);
  mascot.add(antenna);
  const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), new THREE.MeshStandardMaterial({ color: COLORS.coral, emissive: COLORS.coral, emissiveIntensity: 0.6 }));
  antennaTip.position.set(0, 1.98, 0);
  mascot.add(antennaTip);

  mascot.position.set(2.4, -0.6, -1.5);
  mascot.scale.set(1.3, 1.3, 1.3);
  mascot.rotation.y = -0.4;

  const orbitGroup = new THREE.Group();
  scene.add(orbitGroup);
  const satellites = [];
  const satColors = [COLORS.coral, COLORS.tealLight, COLORS.navy];
  for (let i = 0; i < 3; i++) {
    const sat = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22 + i * 0.1, 0.06), new THREE.MeshStandardMaterial({ color: satColors[i], flatShading: true, roughness: 0.6 }));
    satellites.push({ mesh: sat, radius: 2.6 + i * 0.4, speed: 0.22 - i * 0.04, yOffset: 0.3 - i * 0.5, phase: i * 2.1 });
    orbitGroup.add(sat);
  }

  let targetRotY = 0, targetRotX = 0;
  window.addEventListener('pointermove', (e) => {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = (e.clientY / window.innerHeight) * 2 - 1;
    targetRotY = nx * 0.18;
    targetRotX = ny * 0.08;
  });

  const clock = new THREE.Clock();
  let blinkTimer = 2.5;

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    const dt = clock.getDelta();

    mascot.position.y = -0.6 + Math.sin(t * 1.0) * 0.14;
    mascot.rotation.y += (targetRotY - 0.4 - mascot.rotation.y) * 0.03;
    mascot.rotation.x += (targetRotX - mascot.rotation.x) * 0.03;
    antennaTip.material.emissiveIntensity = 0.5 + Math.sin(t * 3) * 0.25;

    blinkTimer -= dt;
    if (blinkTimer < 0) {
      eyeGroup.scale.y = 0.12;
      if (blinkTimer < -0.12) { eyeGroup.scale.y = 1; blinkTimer = 2 + Math.random() * 3; }
    }

    satellites.forEach((s) => {
      const angle = t * s.speed + s.phase;
      s.mesh.position.set(
        2.4 + Math.cos(angle) * s.radius,
        s.yOffset + Math.sin(t * 0.8 + s.phase) * 0.2,
        Math.sin(angle) * s.radius * 0.6 - 2.7
      );
      s.mesh.rotation.y = angle;
    });

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

</body>
</html>
