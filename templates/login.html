<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Report Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --navy: #1B2A4A;
    --teal: #2E9E8F;
    --coral: #E4622C;
    --grey: #8A94A6;
    --line: #E4E7EC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: 20px;
    padding: 36px;
    box-shadow: 0 1px 2px rgba(27,42,74,0.04), 0 24px 48px -24px rgba(27,42,74,0.18);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 6px;
  }
  p.sub { color: var(--grey); font-size: 13.5px; margin: 0 0 22px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 14px;
  }
  input[type="password"]:focus { outline: none; border-color: var(--teal); }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--navy);
    color: white;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14.5px;
    cursor: pointer;
  }
  .error {
    color: var(--coral);
    font-size: 13px;
    margin: -6px 0 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Business Report Generator</h1>
    <p class="sub">Enter the access password to continue.</p>
    <form method="POST">
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <input type="password" name="password" placeholder="Password" autofocus>
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
